<!-- PHD THESIS ROBOTIC MANIPULATION & BELIEF STATE VISUALIZATION -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark Slate Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue Glow Gradient for Belief Ellipse -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Subtle Radial Highlights -->
  <circle cx="280" cy="240" r="220" fill="url(#amberGlow)"/>
  <circle cx="580" cy="260" r="200" fill="url(#blueGlow)"/>

  <!-- Header Banner / Metadata Overlay -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="16" y="20" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MIT CSAIL • PH.D. THESIS RESEARCH</text>
  </g>

  <!-- Left Side: PR2 Robotic Arm & Manipulation Fixture -->
  <g transform="translate(60, 110)">
    <!-- Base Platform / Workspace Table -->
    <rect x="20" y="280" width="340" height="12" rx="4" fill="#334155"/>
    <path d="M 40 292 L 340 292 L 320 330 L 60 330 Z" fill="#1e293b" opacity="0.8"/>

    <!-- Target Assembly Fixture / Slot -->
    <rect x="220" y="240" width="80" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="245" y="250" width="30" height="30" rx="2" fill="#020617" stroke="#f59e0b" stroke-dasharray="3 3" stroke-width="1.5"/>

    <!-- PR2 Robotic Arm Linkage -->
    <!-- Shoulder/Base Joint -->
    <circle cx="80" cy="140" r="24" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="80" cy="140" r="10" fill="#f59e0b"/>

    <!-- Upper Arm Link -->
    <path d="M 80 140 L 160 80" stroke="#64748b" stroke-width="18" stroke-linecap="round"/>
    <path d="M 80 140 L 160 80" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>

    <!-- Elbow Joint -->
    <circle cx="160" cy="80" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="160" cy="80" r="7" fill="#f59e0b"/>

    <!-- Forearm Link -->
    <path d="M 160 80 L 230 170" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
    <path d="M 160 80 L 230 170" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

    <!-- Wrist Joint -->
    <circle cx="230" cy="170" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

    <!-- PR2 Parallel Gripper Assembly -->
    <path d="M 230 170 L 250 195" stroke="#475569" stroke-width="8"/>
    <!-- Gripper Fingers -->
    <path d="M 242 200 L 242 225 L 250 232" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 258 200 L 258 225 L 250 232" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round"/>

    <!-- Manipulated Object (Block) -->
    <rect x="242" y="215" width="16" height="24" rx="2" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Center Right: Belief State Probability Distributions (Uncertainty to Conformant State) -->
  <g transform="translate(420, 100)">
    <!-- Container Panel -->
    <rect x="0" y="0" width="340" height="230" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="32" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Belief State &amp; Pose Uncertainty</text>

    <!-- Initial Wide Uncertainty Ellipse (Uncertain State) -->
    <ellipse cx="110" cy="120" rx="75" ry="45" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
    <ellipse cx="110" cy="120" rx="50" ry="30" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
    <circle cx="110" cy="120" r="4" fill="#ef4444"/>
    <text x="110" y="180" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Uncertain Initial State</text>

    <!-- Trajectory Arrow -->
    <path d="M 180 120 Q 210 100 230 120" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3"/>
    <polygon points="235,120 225,114 227,124" fill="#f59e0b"/>
    <text x="205" y="92" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Conformant Action</text>

    <!-- Funneled / Bounded Belief State (Final State) -->
    <ellipse cx="270" cy="120" rx="24" ry="15" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="270" cy="120" r="3" fill="#38bdf8"/>
    <text x="270" y="180" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bounded Goal Belief</text>
  </g>

  <!-- Bottom Panel: Reliability Benchmark Metric -->
  <g transform="translate(40, 370)">
    <rect x="0" y="0" width="720" height="90" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Left Metric Label -->
    <text x="24" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CONFORMANT PLANNING ASSEMBLY RELIABILITY</text>

    <!-- 1.9% Before Metric -->
    <text x="24" y="70" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900">1.9%</text>
    <text x="90" y="65" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Open-loop Baseline</text>

    <!-- Arrow Transition -->
    <path d="M 230 58 L 290 58" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="296,58 286,52 286,64" fill="#f59e0b"/>

    <!-- 80.7% After Metric -->
    <text x="315" y="70" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">80.7%</text>

    <g transform="translate(435, 48)">
      <rect x="0" y="0" width="260" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="130" y="17" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CONFORMANT BELIEF FUNNELING</text>
    </g>
  </g>
</svg>
