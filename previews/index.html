<!DOCTYPE html>
<!--
  PREVIEW DASHBOARD (Infrastructure Tool)
  This is a standalone DevOps utility deployed independently to gh-pages.
  EXCEPTION: It uses CDN Tailwind and raw utility classes to remain zero-dependency
  and lightweight for operational use outside the main React application boundary.
-->
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Environments | Tech Dancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'media', theme: { extend: { fontFamily: { sans: ['system-ui', '-apple-system', 'sans-serif'], mono: ['ui-monospace', 'monospace'] } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        @media (prefers-color-scheme: dark) { ::-webkit-scrollbar-thumb { background: #475569; } }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div class="max-w-5xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
        <div class="mb-10 text-center sm:text-left flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl mb-2 flex items-center justify-center sm:justify-start gap-3">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    Preview Environments
                </h1>
                <p class="text-slate-500 dark:text-slate-400 text-lg max-w-2xl">Live index of all deployed feature branches and active pull requests.</p>
            </div>
            <div class="flex gap-2">
                <a id="tracking-link" href="#" target="_blank" class="inline-flex items-center justify-center rounded-md text-xs sm:text-sm font-medium transition-colors border border-slate-300 bg-white hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800 h-9 sm:h-10 px-3 sm:px-4 shadow-sm">Review Tracking</a>
                <a href="../" class="inline-flex items-center justify-center rounded-md text-xs sm:text-sm font-medium transition-colors border border-slate-300 bg-white hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800 h-9 sm:h-10 px-3 sm:px-4 shadow-sm">Main Site</a>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-4 mb-8">
            <a href="https://github.com/arii/portfolio/pulls" target="_blank" class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3 sm:p-4 text-center hover:border-blue-500 transition-colors">
                <div id="stat-prs" class="text-2xl sm:text-3xl font-bold text-blue-500">-</div>
                <div class="text-[10px] sm:text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Open PRs</div>
            </a>
            <a href="https://github.com/arii/portfolio/branches" target="_blank" class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3 sm:p-4 text-center hover:border-emerald-500 transition-colors">
                <div id="stat-active" class="text-2xl sm:text-3xl font-bold text-emerald-500">-</div>
                <div class="text-[10px] sm:text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Active</div>
            </a>
            <a href="https://github.com/arii/portfolio/branches/stale" target="_blank" class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3 sm:p-4 text-center hover:border-amber-500 transition-colors">
                <div id="stat-stale" class="text-2xl sm:text-3xl font-bold text-amber-500">-</div>
                <div class="text-[10px] sm:text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Stale</div>
            </a>
            <a href="https://github.com/arii/portfolio/releases" target="_blank" class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3 sm:p-4 text-center hover:border-purple-500 transition-colors">
                <div id="stat-releases" class="text-2xl sm:text-3xl font-bold text-purple-500">-</div>
                <div class="text-[10px] sm:text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Releases</div>
            </a>
            <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-3 sm:p-4 text-center">
                <div id="stat-total" class="text-2xl sm:text-3xl font-bold text-slate-500">-</div>
                <div class="text-[10px] sm:text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Total</div>
            </div>
        </div>

        <div class="mb-8 flex gap-4 flex-wrap">
            <input
              id="search"
              type="text"
              placeholder="Filter branches..."
              class="flex-1 min-w-48 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none"
            />
            <select id="status-filter" class="border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 bg-white dark:bg-slate-900 outline-none">
              <option value="all">All Status</option>
              <option value="pr">Open PRs</option>
              <option value="draft">Draft PRs</option>
              <option value="active">Active Branches</option>
              <option value="merged">Recently Merged</option>
              <option value="stale">Stale (14d+ inactive)</option>
            </select>
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input id="show-automated" type="checkbox" class="w-4 h-4 rounded border-slate-300 dark:border-slate-700 text-blue-500 focus:ring-blue-500">
              <span class="text-sm font-medium text-slate-600 dark:text-slate-400">Show Automated</span>
            </label>
        </div>

        <div id="error-alert" class="hidden mb-8 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-800 dark:text-red-400 px-4 py-4 rounded-lg shadow-sm" role="alert">
            <div class="flex items-center gap-3">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="error-msg" class="font-medium"></span>
            </div>
        </div>
        <div id="loading" class="flex flex-col items-center justify-center py-20 gap-4">
            <svg class="animate-spin h-10 w-10 text-blue-500" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span class="text-lg text-slate-500 dark:text-slate-400 font-medium animate-pulse">Scanning gh-pages deployments...</span>
        </div>
        <div class="pb-4">
            <div id="grid" class="flex flex-col gap-4"></div>
        </div>
        <div id="empty-state" class="hidden text-center py-16 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <svg class="w-12 h-12 text-slate-300 dark:text-slate-700 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-slate-500 dark:text-slate-400 text-lg">No matching preview environments found.</p>
            <button id="reset-filters" class="mt-4 text-blue-500 hover:underline font-medium text-sm">Clear all filters</button>
        </div>

        <footer class="mt-12 pt-8 border-t border-slate-200 dark:border-slate-800 text-center">
            <p class="text-slate-400 dark:text-slate-500 text-xs flex items-center justify-center gap-2">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Last updated: <span id="last-updated">-</span>
            </p>
        </footer>
    </div>
    <script src="./dashboard.js"></script>
</body>
</html>
